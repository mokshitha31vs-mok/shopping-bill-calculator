apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill-app
  template:
    metadata:
      labels:
        app: shopping-bill-app
    spec:
      containers:
        - name: bill-calculator
          image:  mmokshitha/shopping-bill-app:dckr_pat_eOc4kPfmK_M9RS7ewutMlU-0lWE
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
             
