apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-bill-app
  template:
    metadata:
      labels:
        app: shopping-bill-app
    spec:
      containers:
        - name: bill-calculator
          image: YOUR_DOCKERHUB_USERNAME/shopping-bill-app:PASTE_PUSH_1_COMMIT_SHA
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000